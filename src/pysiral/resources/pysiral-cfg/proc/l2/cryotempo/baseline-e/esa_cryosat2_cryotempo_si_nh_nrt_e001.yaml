# Level-2 processor definition file for the ESA Cryo-TEMPO CryoSat-2 near real-time Arctic winter sea ice product
# (Algorithm Baseline-E) - Only to be used after summer 2025

metadata:
    label: "ESA CryoTEMPO CryoSat-2 near real-time Arctic winter sea ice product"
    product_line: cryotempo
    record_type: si-nrt
    platform: cryosat2
    version: E001
    file_version_tag: "E001"
    hemisphere: &hemisphere north

# --- Ingest auxiliary data ---
auxdata:

    - region:
        name: nsidc_2021
        options: null

    - mss:
        name: dtu21
        options:
            latitude_range: [45.0, 90.0]

    - sic:
        name: osi-408
        options:
            exception_on_error: False
            fill_pole_hole:
                pole_hole_lat_threshold: 87.0
                pole_hole_fill_value: 100.

    - icechart:
        name: usnic_grid
        options:
            tie_breaker: "before"   # Options: "before", "after"
            max_offset_days: 21
            hemisphere: *hemisphere
            # This overrides the default output variables
            var_name_dict:
              stage_of_development_highest_concentration: "ice_chart_stage_of_development_highest_concentration"
              fraction_thin_ice: "ice_chart_thin_ice_fraction"
              fraction_first_year_ice: "ice_chart_first_year_ice_fraction"
              fraction_multi_year_ice: &sitype_var_name "ice_chart_multi_year_ice_fraction"
              number_of_seaice_classes: "ice_chart_num_classes"

    - snow:
        name: cryotempo_nh_clim
        options:
            myi_fraction_var_name: *sitype_var_name
            daily_scaling: True
            fyi_correction_factor: 0.5
            exception_on_error: False

# --- Level-2 processor steps ---
procsteps:

    -   module: l2proc.procsteps
        pyclass: L1BL2TransferVariables
        options:
            classifier:
                sigma0: [sig, sigma0]
                peakiness: [pp, pulse_peakiness]
                leading_edge_width: [lew, leading_edge_width]
                leading_edge_quality: [leq, leading_edge_quality]
                first_maximum_index: [fmi, first_maximum_index]
                first_maximum_power: [fmp, first_maximum_power]
                stack_standard_deviation: [ssd, stack_standard_deviation]
                stack_peakiness: [spk, stack_peakiness]
                stack_skewness: [ssk, stack_skewness]
                stack_kurtosis: [skt, stack_kurtosis]
                ocog_width: [ocogw, ocog_width]
                ocog_amplitude: [ocogp, ocog_amplitude]
            correction:
                dry_troposphere: [rcdt, dry_troposphere]
                wet_troposphere: [rcwt, wet_troposphere]
                dynamic_atmosphere: [rdac, dynamic_atmosphere]
                ionosphere: [rcio, ionosphere]
                ocean_tide_elastic: [rcote, ocean_tide_elastic]
                ocean_tide_long_period: [rcotlp, ocean_tide_long_period]
                ocean_loading_tide: [rcolt, ocean_loading_tide]
                solid_earth_tide: [rcset, solid_earth_tide]
                geocentric_polar_tide: [rcgpt,  geocentric_polar_tide]
            time_orbit:
                antenna_pitch: [toantptch, antenna_pitch]
                antenna_roll: [toantrll, antenna_roll]
                antenna_yaw: [toantyaw, antenna_yaw]
                orbit_flag: [tofl, orbit_flag]
            waveform:
                radar_mode: [rmwfm, radar_mode]
                is_valid: [flgwfm, flag_waveform_is_valid]

    # Compute rolling classifier statistics
    -   module: l2proc.procsteps
        pyclass: ParameterRollingStatistics
        options:
            window_size_m: 25000.
            statistics: ["sdev", "mean"]
            input_parameters:
                - pulse_peakiness
                - leading_edge_width
                - sigma0

    # --- Surface type classification algorithm ---
    -   module: surface
        pyclass: ClassifierThresholdSurfaceType
        options:
            surface_types: [ocean, lead, sea_ice]
            ocean:
                - radar_mode: lrm
                  conditions:
                      - "{sea_ice_concentration} < 15.0"
                - radar_mode: sar
                  conditions:
                      - "{sea_ice_concentration} < 15.0"
                      - "{pulse_peakiness_rolling_sdev} < 1.0"
                - radar_mode: sin
                  conditions:
                      - "{sea_ice_concentration} < 15.0"
                      - "{pulse_peakiness_rolling_sdev} < 4.0"
            lead:
                - radar_mode: sar
                  conditions:
                      - "{sea_ice_concentration} >= 15.0"
                      - "{pulse_peakiness} >= 66.0"
                      - "{sigma0} >= 23.0"
                      - "{leading_edge_width} <= 0.75"

                - radar_mode: sin
                  conditions:
                      - "{sea_ice_concentration} >= 15.0"
                      - "{pulse_peakiness} >= 260.0"
                      - "{sigma0} >= 24.0"
                      - "{leading_edge_width} <= 1.05"
            sea_ice:
                - radar_mode: sar
                  exclude: lead
                  conditions:
                      - "{sea_ice_concentration} >= 15.0"
                      - "{leading_edge_quality} <= 1.02"
                - radar_mode: sin
                  exclude: lead
                  conditions:
                      - "{sea_ice_concentration} >= 15.0"
                      - "{leading_edge_quality} <= 1.02"

    # Retracking algorithm dependent on surface type
    -   module: retracker
        pyclass: Level2RetrackerContainer
        options:
            lead:
                pyclass: cTFMRA
                options:
                    # if arrays than [lrm, sar, sin]
                    threshold: 0.5
                    offset: 0.0
                    noise_level_range_bin_idx: [0, 5]
                    wfm_oversampling_factor: 10
                    wfm_oversampling_method: linear
                    wfm_smoothing_window_size: [11, 11, 21]
                    first_maximum_normalized_threshold: [0.15, 0.15, 0.45]
                    first_maximum_local_order: 1
                    first_maximum_ignore_leading_bins: 0
                    range_bias: [-0.022, 0.047, 0.017]
                    uncertainty:
                        type: fixed
                        value: 0.1

            sea_ice:
                pyclass: cTFMRA
                options:
                    # if arrays than [lrm, sar, sin]
                    threshold: 0.5
                    offset: 0.0
                    noise_level_range_bin_idx: [0, 5]
                    wfm_oversampling_factor: 10
                    wfm_oversampling_method: linear
                    wfm_smoothing_window_size: [11, 11, 21]
                    first_maximum_normalized_threshold: [0.15, 0.15, 0.45]
                    first_maximum_local_order: 1
                    first_maximum_ignore_leading_bins: 0
                    range_bias: [-0.022, 0.047, 0.017]
                    uncertainty:
                        type: fixed
                        value: 0.1

    # Apply the range corrections
    -   module: l2proc.procsteps
        pyclass: L2ApplyRangeCorrections
        options:
            corrections:
                - dry_troposphere
                - wet_troposphere
                - dynamic_atmosphere
                - ionosphere
                - ocean_tide_elastic
                - ocean_tide_long_period
                - ocean_loading_tide
                - solid_earth_tide
                - geocentric_polar_tide

    # Algorithm for instantaneous sea surface height (mss + ssa) and radar freeboard
    -   module: sla
        pyclass: SLASmoothedLinear
        options:
            use_ocean_wfm: False
            smooth_filter_width_m: 100000.0
            smooth_filter_width_footprint_size: 300.0
            tiepoint_elevation_filter:
                elevation_filter_window_m: 50000.
                upper_limit_standard_deviation: 2
                lower_limit_standard_deviation: 3
                minimum_standard_deviation_m: 0.1
            uncertainty_tiepoints_distance_max: 100000.
            uncertainty_minimum: 0.02
            uncertainty_maximum: 0.10
            marine_segment_filter:
                minimum_lead_number: 1
            tiepoint_maxdist_filter:
                maximum_distance_to_tiepoint: 200000.
                edges_only: False

    # Estimation of Radar Freeboard
    -   module: frb
        pyclass: RadarFreeboardDefault
        options: null

    # Filter out-of-valid range freeboard values
    -   module: filter
        pyclass: L2ParameterValidRange
        options:
            source_variable: afrb
            target_variables: [afrb]
            valid_minimum_point_value: -0.35
            valid_maximum_point_value: 2.35

    # Algorithm for converting radar freeboard into freeboard
    -   module: frb
        pyclass: SnowGeometricCorrection
        options:
            vacuum_light_speed_reduction: mallett2020

    # Filter out-of-valid range sea ice freeboard values
    -   module: filter
        pyclass: L2ParameterValidRange
        options:
            source_variable: frb
            target_variables: [frb]
            valid_minimum_point_value: -0.25
            valid_maximum_point_value: 2.25

    -   module: sit
        pyclass: AlexandrovSeaIceDensity
        options:
            myi_fraction_var_name: *sitype_var_name
            fyi_density: 916.7
            myi_density: 882.0
            uncertainty:
                fyi_density: 35.7
                myi_density: 23.0

    # Algorithm for getting sea ice thickness from other l2 parameters
    -   module: sit
        pyclass: SeaIceFreeboard2SIT
        options:
            water_density: 1024.0

    # Filters after thickness computation
    -   module: filter
        pyclass: L2ParameterValidRange
        options:
            source_variable: sit
            target_variables: [sit]
            valid_minimum_point_value: -0.5
            valid_maximum_point_value: 10.5

    # Add a filter flag to detect anomalous freeboards in the marginal ice zone
    -   module: filter
        pyclass: MarginalIceZoneFilterFlag
        options:
            boolean_flag_values: True
            ice_edge_proximity:
                sea_ice_concentration_max: 75.
                low_ice_concentration_distance_max: 200000.
                ocean_distance_max: 300000.
                leading_edge_width_rolling_mean_min: 2.0
                pulse_peakiness_rolling_sdev_max: 15.0
            ice_edge_transition:
                sea_ice_filter_size_m: 300000.
                ocean_filter_size_m: 25000.
                freeboard_smoother_filter_size_m: 150000.
                sea_ice_freeboard_miz_gradient: 0.002
                leading_edge_width_ocean_value: 2.5

    # Create a filtered/smoothed version of sea ice freeboard
    -   module: filter
        pyclass: ParameterSmoother
        options:
            source_variable: frb
            target_variable_name: sea_ice_freeboard_filtered
            target_variable_id: frbflt
            smoothing_method: lowess
            smoother_args:
                filter_size_n_points: 83
                filter_props:
                     it: 1

    # Create a filtered/smoothed version of sea ice thickness
    -   module: filter
        pyclass: ParameterSmoother
        options:
            source_variable: sit
            target_variable_name: sea_ice_thickness_filtered
            target_variable_id: sitflt
            smoothing_method: lowess
            smoother_args:
                filter_size_n_points: 83
                filter_props:
                     it: 1

    # Remove any finite values over non-ocean surfaces
    -   module: filter
        pyclass: RemoveNonOceanData
        options:
            target_variables:
              - sea_level_anomaly

    # Create an instrument mode flag for CryoSat-2 data
    # (instrument mode = radar mode + 1)
    -   module: l2proc.procsteps
        pyclass: CS2InstrumentModeflag
        options: null
