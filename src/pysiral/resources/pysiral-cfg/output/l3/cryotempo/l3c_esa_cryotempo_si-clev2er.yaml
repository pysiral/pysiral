# This is the output definition for ESA CCI on sea ice phase 2 (SICCI-2) product files

# Metadata
metadata:
  output_id: l3c_tempo_d001
  data_level: 3
  data_level_description: Level-3 colated (gridded geophysical parameters)

# Output Definition (for each period definition)
# CS_OFFL_SIR_TDP_SD_ARCTIC_20231101T000031_20231130T234033_GRID_____C001.nc
filenaming:
  month: "CS_OFFL_SIR_TDP_SI_{source_hemisphere:select;ARCTIC;ANTARCTIC}_{l2_time_coverage_start:%Y%m%dT%H%M%S}_{l2_time_coverage_end:%Y%m%dT%H%M%S}_GRID_____D001.nc"
  monthly: "CS_OFFL_SIR_TDP_SI_{source_hemisphere:select;ARCTIC;ANTARCTIC}_{l2_time_coverage_start:%Y%m%dT%H%M%S}_{l2_time_coverage_end:%Y%m%dT%H%M%S}_GRID_____D001.nc"
  isoweek: "CS_OFFL_SIR_TDP_SI_{source_hemisphere:select;ARCTIC;ANTARCTIC}_{l2_time_coverage_start:%Y%m%dT%H%M%S}_{l2_time_coverage_end:%Y%m%dT%H%M%S}_GRID_____D001.nc"
  day: "CS_OFFL_SIR_TDP_SI_{source_hemisphere:select;ARCTIC;ANTARCTIC}_{l2_time_coverage_start:%Y%m%dT%H%M%S}_{l2_time_coverage_end:%Y%m%dT%H%M%S}_GRID_____D001.nc"
  custom: "CS_OFFL_SIR_TDP_SI_{source_hemisphere:select;ARCTIC;ANTARCTIC}_{l2_time_coverage_start:%Y%m%dT%H%M%S}_{l2_time_coverage_end:%Y%m%dT%H%M%S}_GRID_____D001.nc"
  default: "CS_OFFL_SIR_TDP_SI_{source_hemisphere:select;ARCTIC;ANTARCTIC}_{l2_time_coverage_start:%Y%m%dT%H%M%S}_{l2_time_coverage_end:%Y%m%dT%H%M%S}_GRID_____D001.nc"

product_level_subfolder: l3c

grid_options:
  flip_yc: True
  time_dim_is_unlimited: False

# A list of global attributes
# (see: https://www.unidata.ucar.edu/software/thredds/current/netcdf-java/metadata/DataDiscoveryAttConvention.html)
global_attributes:
  - title: "Cryo-TEMPO Sea Ice Thematic Product"
  - project: "ESA Cryo-TEMPO"
  - creator_name: "ESA Cryo-TEMPO Project"
  - creator_url: "http://cryosat.mssl.ucl.ac.uk/tempo"
  - date_created: "{utcnow}"
  - platform: "CryoSat-2"
  - sensor: "SIRAL"
  - zone: "{source_hemisphere:select;Arctic;Antarctic}"
  - geospatial_lat_min: "{geospatial_lat_min}"
  - geospatial_lat_max: 90.0
  - geospatial_lon_min: -180.0
  - geospatial_lon_max: 180.0
  - geospatial_vertical_min: 0.0
  - geospatial_vertical_max: 0.0
  - spatial_resolution: "{grid_spacing_tag} grid spacing"
  - geospatial_bounds_crs: "EPSG:693{source_hemisphere:select;1;2}"
  - time_coverage_start: "{l2_time_coverage_start}"
  - time_coverage_end: "{l2_time_coverage_end}"
  - time_coverage_duration: "{time_coverage_duration}"
  - time_coverage_resolution: "{time_coverage_duration:period}"
  - product_baseline: "D"
  - product_version: "001"
  - processing_level: "Level-3 Collated (l3c)"
  - cdm_data_type: "Grid"
  - history: "{utcnow:%a %b %d %H:%M:%S %Y:} Product generated with pysiral version {pysiral_version}\n"
  - sw_version: "{pysiral_version}"
  - doi: ""

# A list of variables and their attributes
# The variable subtag must match the name of the level-3 parameter
variables:

  lon:
    var_source_name: longitude
    long_name: longitude coordinate
    standard_name: longitude
    units: degrees_east

  lat:
    var_source_name: latitude
    long_name: latitude coordinate
    standard_name: latitude
    units: degrees_north

  radar_freeboard:
    long_name: "radar freeboard"
    units: m
    grid_mapping: "Lambert_Azimuthal_Grid"
    coordinates: "time lat lon"
    comment: "elevation of retracked point above instantaneous sea surface height (no snow range corrections)"

  radar_freeboard_uncertainty:
    long_name: "uncertainty associated with radar freeboard"
    units: m
    grid_mapping: "Lambert_Azimuthal_Grid"
    coordinates: "time lat lon"

  sea_ice_freeboard:
    long_name: "sea ice freeboard"
    standard_name: sea_ice_freeboard
    units: m
    grid_mapping: "Lambert_Azimuthal_Grid"
    coordinates: "time lat lon"
    comment: "elevation of retracked point above instantaneous sea surface height (with snow range corrections)"

  sea_ice_freeboard_uncertainty:
    long_name: "uncertainty associated to sea ice freeboard"
    standard_name: sea_ice_freeboard standard_error
    units: m
    grid_mapping: "Lambert_Azimuthal_Grid"
    coordinates: "time lat lon"

  snow_depth:
    long_name: "thickness of the snow layer"
    standard_name: surface_snow_thickness
    units: m
    valid_min: 0.0
    valid_max: 0.6
    grid_mapping: "Lambert_Azimuthal_Grid"
    coordinates: "time lat lon"

  snow_depth_uncertainty:
    long_name: "uncertainty of the snow layer thickness"
    standard_name: surface_snow_thickness standard_error
    units: m
    grid_mapping: "Lambert_Azimuthal_Grid"
    coordinates: "time lat lon"
